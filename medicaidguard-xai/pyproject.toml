[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medicaidguard-xai"
version = "0.1.0"
description = "Explainable, statistically validated prioritisation of suspicious Medicaid billing and EVV activity"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["healthcare", "program-integrity", "explainable-ai", "anomaly-detection", "medicaid", "evv"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4",
  "pyarrow>=15.0", "PyYAML>=6.0", "lightgbm>=4.3", "shap>=0.44",
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6",
  "streamlit>=1.32", "plotly>=5.19", "joblib>=1.3", "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.3", "mypy>=1.9", "pre-commit>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
